<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#fff1c9"/>
  <!-- the row being built: three blank lines, one with a card in place -->
  <g stroke="#2b4a8b" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 22" fill="none">
    <path d="M44 210 H156"/>
    <path d="M200 210 H312"/>
    <path d="M356 210 H468"/>
  </g>
  <rect x="44" y="140" width="112" height="76" rx="18" fill="#bfe8bf" stroke="#1e7a2e" stroke-width="8"/>
  <path d="M68 178 l16 16 l34 -34" fill="none" stroke="#1e7a2e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- colorful word cards waiting below -->
  <g stroke="#2b4a8b" stroke-width="8" stroke-linejoin="round">
    <rect x="40" y="340" width="120" height="76" rx="18" fill="#ffd9a8" transform="rotate(-6 100 378)"/>
    <rect x="196" y="364" width="120" height="76" rx="18" fill="#cfe0ff" transform="rotate(4 256 402)"/>
    <rect x="352" y="336" width="120" height="76" rx="18" fill="#ffe9a3" transform="rotate(-3 412 374)"/>
  </g>
  <g stroke="#2b4a8b" stroke-width="10" stroke-linecap="round">
    <path d="M64 372 H132"/>
    <path d="M222 402 H290"/>
    <path d="M376 366 H444"/>
  </g>
  <!-- the arrow: a card moves up into the row -->
  <g fill="#1d4ed8" stroke="#1d4ed8" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M256 330 V262" fill="none" stroke-width="16"/>
    <path d="M224 282 L256 240 L288 282 Z"/>
  </g>
  <!-- a lifted card on its way, with a pointing hand -->
  <rect x="200" y="96" width="112" height="76" rx="18" fill="#ffffff" stroke="#2b4a8b" stroke-width="8" transform="rotate(6 256 134)"/>
  <path d="M226 136 H286" stroke="#2b4a8b" stroke-width="10" stroke-linecap="round" transform="rotate(6 256 134)"/>
  <g fill="#ffd9a8" stroke="#2b4a8b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="300" y="112" width="28" height="64" rx="14"/>
  </g>
</svg>
